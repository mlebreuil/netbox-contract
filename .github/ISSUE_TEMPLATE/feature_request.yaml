---
name: ✨ Feature Request
description: Propose a new netbox-contract plugin feature or enhancement
labels: ["type: feature", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: >
        **NOTE:** This form is only for submitting well-formed proposals to extend or modify
        netbox-contract plugin in some way. If you're trying to solve a problem but can't figure out how, or if
        you still need time to work on the details of a proposed new feature, please start a
        [discussion](https://github.com/mlebreuil/netbox-contract/discussions) instead.
  - type: input
    attributes:
      label: netbox-contract plugin version
      description: What version of netbox-contract plugin are you currently running?
      placeholder: v2.6.0
    validations:
      required: true
  - type: input
    attributes:
      label: NetBox version
      description: What version of NetBox are you currently running?
      placeholder: v4.7.4
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Feature type
      options:
        - Data model extension
        - New functionality
        - Change to existing functionality
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed functionality
      description: >
        Describe the new feature or behavior you are proposing, and any changes to work flows, data models
        and/or the user interface you expect. You do not need to provide a design or implementation plan:
        accepted proposals are assessed, specified and planned by the maintainers before any work starts.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use case
      description: >
        Explain how adding this functionality would benefit netbox-contract plugin users. What need does it address?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Database changes
      description: >
        Note any changes to the database schema necessary to support the new feature. For example,
        does the proposal require adding a new model or field? (Not all new features require database
        changes.)
  - type: textarea
    attributes:
      label: Impact on existing interfaces
      description: >
        Would this change or remove an existing REST field or endpoint, GraphQL field, plugin setting or
        import column, or alter the behavior of existing data? These are public interfaces that are
        deprecated before they are removed. (Not all new features affect existing interfaces.)
  - type: textarea
    attributes:
      label: External dependencies
      description: >
        List any new dependencies on external libraries or services that this new feature would
        introduce. For example, does the proposal require the installation of a new Python package?
        (Not all new features introduce new dependencies.)
  - type: checkboxes
    attributes:
      label: Volunteer
      description: >
        Check this box if you would like to own this issue and submit a pull request to
        resolve it once it has been accepted (optional). Please don't submit a pull request
        until the issue has been assigned to you.
      options:
        - label: I volunteer to implement this feature if it is accepted
