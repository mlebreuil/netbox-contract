repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.6
  hooks:
    - id: ruff
      name: "Ruff linter"
      args: [ "netbox_contract/" ]

- repo: local
  hooks:
    - id: spec-ids
      name: "Spec identifiers"
      entry: python3 utils/spec_ids.py check
      language: system
      pass_filenames: false
      files: '^(specs/|utils/spec_ids\.py|netbox_contract/|docs/|CHANGELOG\.md|CLAUDE\.md|CONTRIBUTING\.md|README\.md)'
