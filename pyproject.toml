# See PEP 518 for the spec of this file
# https://www.python.org/dev/peps/pep-0518/

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-contract"
dynamic = ["version"]
authors = [
  { name="Marc Lebreuil", email="marc@famillelebreuil.net" },
]

description = "Contract management plugin for Netbox"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

# Django is provided, and pinned, by NetBox (Constitution VI): do not list it here.
dependencies = [
    'python-dateutil',
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["check-manifest", "mkdocs", "mkdocs-material", "ruff"]
test = ["coverage", "pytest", "pytest-cov"]

[project.urls]
"Homepage" = "https://github.com/mlebreuil/netbox-contract"
"Bug Tracker" = "https://github.com/mlebreuil/netbox-contract/issues"

[tool.setuptools.packages.find]
include = ["netbox_contract*"]
exclude = ["netbox_contract.tests*"]

[tool.setuptools.package-data]
netbox_contract = ["templates/**/*.html", "locale/**/*.po", "locale/**/*.mo"]

[tool.setuptools.dynamic]
version = {attr = "netbox_contract.version.__version__"}
